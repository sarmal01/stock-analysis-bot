name: Daily Stock Analysis

on:
  schedule:
    # 毎日日本時間 18:00 (UTC 9:00) に実行
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # 手動で実行ボタンを押せるようにする設定

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Node.js 20の警告を消すため v3 -> v4 にアップデート
      - uses: actions/checkout@v4

      # Node.js 20の警告を消すため v4 -> v5 にアップデート
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # --- ここを追加：Discordへの「鍵」を渡します ---
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stock_research_data.json
          git commit -m "Update analysis data" || echo "No changes to commit"
          git push
